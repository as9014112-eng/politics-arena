<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>째무를 빗질하기</title>
  <style>
    :root {
      --page-bg: #dfdfe2;
      --card-bg: #f3f3f3;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --link: #bf4d59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .floating-actions {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .floating-actions button {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(35, 35, 35, 0.55);
      color: #fff;
      font-size: 14px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
    }

    .page {
      max-width: 860px;
      margin: 0 auto;
      min-height: 100vh;
      border-left: 1px solid #c9c9ce;
      border-right: 1px solid #c9c9ce;
      background: #ececee;
      padding: 18px 0 48px;
    }

    .card {
      width: min(92%, 560px);
      margin: 0 auto;
      background: var(--card-bg);
      padding: 14px 14px 28px;
    }

    .score {
      margin: 0;
      color: #5c5c5c;
      font-size: 68px;
      font-weight: 400;
      line-height: 1;
    }

    .hero-wrap {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      min-height: 500px;
    }

    .hero-wrap img {
      width: 360px;
      max-width: 100%;
      object-fit: contain;
      filter: saturate(1.05);
    }

    .desc {
      width: min(92%, 560px);
      margin: 18px auto 0;
      font-size: 31px;
      line-height: 1.8;
      letter-spacing: -0.02em;
    }

    .desc p {
      margin: 0 0 14px;
    }

    .meta {
      color: var(--muted);
    }

    .more {
      color: var(--link);
      margin-top: 8px;
      display: inline-block;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    h2 {
      margin-top: 34px;
      margin-bottom: 10px;
      font-size: 48px;
      line-height: 1.1;
    }

    .login {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 900px) {
      .desc { font-size: 24px; }
      h2 { font-size: 40px; }
    }

    @media (max-width: 600px) {
      .score { font-size: 52px; }
      .desc { font-size: 20px; }
      h2 { font-size: 34px; }
      .hero-wrap { min-height: 380px; }
      .hero-wrap img { width: 280px; }
    }
  </style>
</head>
<body>
  <aside class="floating-actions" aria-label="quick actions">
    <button type="button">+ Follow artbyeori</button>
    <button type="button">+ Add To Collection</button>
  </aside>

  <main class="page">
    <section class="card" aria-label="game card">
      <p class="score">0</p>
      <div class="hero-wrap">
        <img src="https://images.unsplash.com/photo-1586042091284-bd35c8c1d917?auto=format&fit=crop&w=700&q=80" alt="뒤돌아 앉아 있는 주황 고양이" />
      </div>
    </section>

    <section class="desc" aria-label="description">
      <p>당신은 째무를 빗질하기 위해 고용되었습니다.</p>
      <p>모바일로 플레이 시 버그가 있을 수 있음</p>
      <p class="meta">개발자 : 벼리 (@artbyeori)</p>
      <p class="meta">고양이 : 째무 (@jjaemu.)</p>

      <a href="#" class="more">More information ▾</a>

      <h2>Comments</h2>
      <p><a class="login" href="#">Log in with itch.io</a> to leave a comment.</p>
    </section>
  </main>
</body>
</html>
